# Site nginx, installé en /etc/nginx/sites-available/hr par installer.sh.
# HTTP seulement au départ : « certbot --nginx -d admin.i3s.unice.fr » ajoute ensuite
# le certificat, le bloc HTTPS et la redirection de HTTP vers HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name admin.i3s.unice.fr;

    # Restauration d'un export JSON complet (même limite que spring.servlet.multipart).
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # L'import HAL de toutes les personnes peut durer plusieurs minutes.
        proxy_read_timeout 600s;
    }
}
