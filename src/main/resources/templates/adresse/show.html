<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Adresses')}"></head>
<body>
<nav th:replace="~{layout/fragments :: nav}"></nav>
<main class="container my-4">
    <h1 th:text="${adresse}"></h1>
    <dl class="row">
        <dt class="col-sm-3">Rue</dt><dd class="col-sm-9" th:text="${adresse.rue}"></dd>
        <dt class="col-sm-3">Ville</dt><dd class="col-sm-9" th:text="${adresse.ville}"></dd>
        <dt class="col-sm-3">Code postal</dt><dd class="col-sm-9" th:text="${adresse.codePostal}"></dd>
        <dt class="col-sm-3">Pays</dt>
        <dd class="col-sm-9">
            <a th:if="${adresse.pays} != null" th:href="@{'/pays/' + ${adresse.pays.id}}" th:text="${adresse.pays.nom}"></a>
        </dd>
        <dt class="col-sm-3">GPS</dt><dd class="col-sm-9" th:text="${adresse.latitude} + ', ' + ${adresse.longitude}"></dd>
    </dl>

    <h5>Personnes à cette adresse</h5>
    <ul>
        <li th:each="p : ${adresse.personnes}">
            <a th:href="@{'/personnes/' + ${p.id}}" th:text="${p}"></a>
        </li>
    </ul>

    <a class="btn btn-secondary" th:href="@{'/adresses/' + ${adresse.id} + '/edit'}">Modifier</a>
    <a class="btn btn-link" th:href="@{/adresses}">Retour</a>
</main>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
