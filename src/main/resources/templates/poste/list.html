<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Postes')}"></head>
<body>
<nav th:replace="~{layout/fragments :: nav}"></nav>
<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Postes</h1>
        <div class="d-flex gap-2" th:if="${peutModifier}">
            <a class="btn btn-secondary" th:href="@{/export/json/postes}" title="Télécharger les postes au format JSON">Export JSON</a>
            <a class="btn btn-primary" th:href="@{/postes/new}">Ajouter</a>
        </div>
    </div>
    <table class="table table-striped">
        <thead><tr><th>Personne</th><th>Employeur</th><th>Grade</th><th>Début</th><th>Fin</th><th th:if="${peutModifier}"></th></tr></thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td>
                <a th:if="${item.personne} != null" th:href="@{'/personnes/' + ${item.personne.id}}" th:text="${item.personne}"></a>
            </td>
            <td>
                <a th:if="${item.employeur} != null" th:href="@{'/employeurs/' + ${item.employeur.id}}" th:text="${item.employeur.nom}"></a>
            </td>
            <td th:text="${item.grade} != null ? ${item.grade.code} : ''"></td>
            <td th:text="${item.dateDebut}"></td>
            <td th:text="${item.dateFin}"></td>
            <td class="text-end" th:if="${peutModifier}">
                <a class="btn btn-sm btn-secondary" th:href="@{'/postes/' + ${item.id} + '/edit'}">Modifier</a>
                <form class="d-inline" th:action="@{'/postes/' + ${item.id} + '/delete'}" method="post"
                      onsubmit="return confirm('Supprimer ce poste ?');">
                    <button class="btn btn-sm btn-danger" type="submit">Supprimer</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
