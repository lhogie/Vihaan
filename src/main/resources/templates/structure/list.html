<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Structures')}"></head>
<body>
<nav th:replace="~{layout/fragments :: nav}"></nav>
<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Structures</h1>
        <div class="d-flex gap-2" th:if="${peutModifier}">
            <a class="btn btn-secondary" th:href="@{/export/json/structures}" title="Télécharger les structures au format JSON">Export JSON</a>
            <a class="btn btn-primary" th:href="@{/structures/new}">Ajouter</a>
        </div>
    </div>
    <table class="table table-striped">
        <thead><tr><th>Nom</th><th>Structure parente</th><th th:if="${peutModifier}"></th></tr></thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td><a th:href="@{'/structures/' + ${item.id}}" th:text="${item.nom}"></a></td>
            <td>
                <a th:if="${item.structureParente} != null" th:href="@{'/structures/' + ${item.structureParente.id}}" th:text="${item.structureParente.nom}"></a>
            </td>
            <td class="text-end" th:if="${peutModifier}">
                <a class="btn btn-sm btn-secondary" th:href="@{'/structures/' + ${item.id} + '/edit'}">Modifier</a>
                <form class="d-inline" th:action="@{'/structures/' + ${item.id} + '/delete'}" method="post"
                      onsubmit="return confirm('Supprimer cette structure ?');">
                    <button class="btn btn-sm btn-danger" type="submit">Supprimer</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
