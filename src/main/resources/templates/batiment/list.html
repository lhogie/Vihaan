<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Batiments')}"></head>
<body>
<nav th:replace="~{layout/fragments :: nav}"></nav>
<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Bâtiments</h1>
        <a class="btn btn-primary" th:href="@{/batiments/new}">Ajouter</a>
    </div>
    <table class="table table-striped">
        <thead><tr><th>Nom</th><th>Campus</th><th></th></tr></thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td><a th:href="@{'/batiments/' + ${item.id}}" th:text="${item.nom}"></a></td>
            <td>
                <a th:if="${item.campus} != null" th:href="@{'/campus/' + ${item.campus.id}}" th:text="${item.campus.nom}"></a>
            </td>
            <td class="text-end">
                <a class="btn btn-sm btn-secondary" th:href="@{'/batiments/' + ${item.id} + '/edit'}">Modifier</a>
                <form class="d-inline" th:action="@{'/batiments/' + ${item.id} + '/delete'}" method="post"
                      onsubmit="return confirm('Supprimer ce bâtiment ?');">
                    <button class="btn btn-sm btn-danger" type="submit">Supprimer</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
