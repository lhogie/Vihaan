<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Recherche')}"></head>
<body>
<nav th:replace="~{layout/fragments :: nav}"></nav>
<main class="container my-4">
    <h1>Résultats pour « <span th:text="${q}"></span> »</h1>

    <p th:if="${groupes.isEmpty()}" class="text-muted">Aucun résultat.</p>

    <div th:each="groupe : ${groupes}" class="mb-4">
        <h4 th:text="${groupe.label()}"></h4>
        <ul class="list-group">
            <li class="list-group-item" th:each="hit : ${groupe.hits()}">
                <a th:href="@{'/' + ${groupe.urlPrefix()} + '/' + ${hit.id()}}" th:text="${hit.display()}"></a>
            </li>
        </ul>
    </div>
</main>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
