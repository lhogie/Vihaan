<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Campus')}"></head>
<body>
<nav th:replace="~{layout/fragments :: nav}"></nav>
<main class="container my-4">
    <h1 th:text="${campus.id} == null ? 'Nouveau campus' : 'Modifier le campus'"></h1>
    <form th:action="@{/campus}" th:object="${campus}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Nom</label>
            <input class="form-control" th:field="*{nom}">
        </div>
        <button class="btn btn-primary" type="submit">Enregistrer</button>
        <a class="btn btn-link" th:href="@{/campus}">Annuler</a>
    </form>
</main>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
