<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - Gestion RH labo'">Gestion RH labo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Gestion RH labo</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto flex-wrap">
                <li class="nav-item"><a class="nav-link" th:href="@{/personnes}">Personnes</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/structures}">Structures</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/contrats}">Contrats</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/employeurs}">Employeurs</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/grades}">Grades</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/postes}">Postes</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/bureaux}">Bureaux</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/batiments}">Bâtiments</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/campus}">Campus</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/adresses}">Adresses</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/pays}">Pays</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/publications}">Publications</a></li>
            </ul>
            <form class="d-flex" th:action="@{/recherche}" method="get">
                <input class="form-control me-2" type="search" name="q" placeholder="Rechercher...">
                <button class="btn btn-outline-light" type="submit">Rechercher</button>
            </form>
        </div>
    </div>
</nav>
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
