<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - Gestion RH labo'">Gestion RH labo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
<aside th:fragment="nav" class="barre">
    <div class="barre-tete">
        <a class="barre-marque" th:href="@{/}">Gestion RH<small>Laboratoire</small></a>
        <button class="barre-bascule" type="button" data-bs-toggle="collapse" data-bs-target="#barreContenu"
                aria-controls="barreContenu" aria-expanded="false">Menu</button>
    </div>
    <div class="barre-contenu collapse" id="barreContenu">
        <form class="barre-recherche" th:action="@{/recherche}" method="get" role="search">
            <input type="search" name="q" placeholder="Rechercher…" aria-label="Rechercher" th:value="${q}">
        </form>
        <th:block th:each="groupe : ${ {
                {'Personnes', { {'/personnes', 'Personnes'}, {'/postes', 'Postes'}, {'/publications', 'Publications'} } },
                {'Organisation', { {'/structures', 'Structures'}, {'/contrats', 'Contrats'}, {'/employeurs', 'Employeurs'}, {'/grades', 'Grades'} } },
                {'Lieux', { {'/campus', 'Campus'}, {'/batiments', 'Bâtiments'}, {'/bureaux', 'Bureaux'}, {'/adresses', 'Adresses'}, {'/pays', 'Pays'} } }
            } }">
            <nav class="barre-groupe" th:attr="aria-label=${groupe[0]}">
                <div class="barre-groupe-titre" th:text="${groupe[0]}"></div>
                <a th:each="lien : ${groupe[1]}" class="barre-lien" th:href="@{${lien[0]}}" th:text="${lien[1]}"
                   th:classappend="${cheminCourant != null and (cheminCourant == lien[0] or #strings.startsWith(cheminCourant, lien[0] + '/'))} ? 'actif'"></a>
            </nav>
        </th:block>
        <div class="barre-pied">
            <div class="barre-groupe-titre">Données</div>
            <a th:href="@{/rapport}" title="Télécharger un rapport Markdown de la base">Rapport Markdown</a>
            <a th:if="${peutModifier}" th:href="@{/export/json}" title="Télécharger toute la base au format JSON">Export JSON</a>
            <a th:if="${peutModifier}" th:href="@{/import}" title="Remplacer la base par un export JSON">Restaurer</a>
            <a th:if="${peutModifier}" class="barre-danger" th:href="@{/vider}" title="Supprimer toutes les données">Vider la base</a>
            <div class="barre-utilisateur" th:if="${utilisateurCourant != null}">
                <span><strong th:text="${utilisateurCourant}"></strong><br>
                    <span th:text="${peutModifier} ? 'Gestionnaire' : 'Lecteur'"></span></span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit">Se déconnecter</button>
                </form>
            </div>
        </div>
    </div>
</aside>
<div th:fragment="messages">
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${erreur}" th:text="${erreur}"></div>
</div>
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
