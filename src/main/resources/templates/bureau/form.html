<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Bureaux')}"></head>
<body>
<nav th:replace="~{layout/fragments :: nav}"></nav>
<main class="container my-4">
    <h1 th:text="${bureau.id} == null ? 'Nouveau bureau' : 'Modifier le bureau'"></h1>
    <form th:action="@{/bureaux}" th:object="${bureau}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Nom</label>
            <input class="form-control" th:field="*{nom}">
        </div>
        <div class="mb-3">
            <label class="form-label">Capacité</label>
            <input class="form-control" type="number" th:field="*{capacite}">
        </div>
        <div class="mb-3">
            <label class="form-label">Bâtiment</label>
            <select class="form-select" name="batimentId">
                <option value="">-- aucun --</option>
                <option th:each="b : ${batimentList}" th:value="${b.id}"
                        th:selected="${bureau.batiment} != null and ${bureau.batiment.id} == ${b.id}"
                        th:text="${b.nom}"></option>
            </select>
        </div>
        <button class="btn btn-primary" type="submit">Enregistrer</button>
        <a class="btn btn-link" th:href="@{/bureaux}">Annuler</a>
    </form>
</main>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
