<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Pays')}"></head>
<body>
<nav th:replace="~{layout/fragments :: nav}"></nav>
<main class="container my-4">
    <h1 th:text="${pays.nom}"></h1>
    <dl class="row">
        <dt class="col-sm-3">Code</dt><dd class="col-sm-9" th:text="${pays.code}"></dd>
    </dl>

    <h5>Adresses dans ce pays</h5>
    <ul>
        <li th:each="a : ${pays.adresses}">
            <a th:href="@{'/adresses/' + ${a.id}}" th:text="${a}"></a>
        </li>
    </ul>

    <a class="btn btn-secondary" th:href="@{'/pays/' + ${pays.id} + '/edit'}">Modifier</a>
    <a class="btn btn-link" th:href="@{/pays}">Retour</a>
</main>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
