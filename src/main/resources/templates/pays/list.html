<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Pays')}"></head>
<body>
<nav th:replace="~{layout/fragments :: nav}"></nav>
<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Pays</h1>
        <div class="d-flex gap-2" th:if="${peutModifier}">
            <a class="btn btn-secondary" th:href="@{/export/json/pays}" title="Télécharger les pays au format JSON">Export JSON</a>
            <a class="btn btn-primary" th:href="@{/pays/new}">Ajouter</a>
        </div>
    </div>
    <table class="table table-striped">
        <thead><tr><th>Code</th><th>Nom</th><th th:if="${peutModifier}"></th></tr></thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.code}"></td>
            <td><a th:href="@{'/pays/' + ${item.id}}" th:text="${item.nom}"></a></td>
            <td class="text-end" th:if="${peutModifier}">
                <a class="btn btn-sm btn-secondary" th:href="@{'/pays/' + ${item.id} + '/edit'}">Modifier</a>
                <form class="d-inline" th:action="@{'/pays/' + ${item.id} + '/delete'}" method="post"
                      onsubmit="return confirm('Supprimer ce pays ?');">
                    <button class="btn btn-sm btn-danger" type="submit">Supprimer</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
